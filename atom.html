<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohr Model Atom</title>

    <style>
        body {
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container boundary box */
        .atom {
            position: relative;
            width: 320px;
            height: 320px;
            pointer-events: none;
        }

        /* Nucleus centered perfectly */
        .nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .proton {
            background-color: blue;
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }

        /* Shells centered and sized via variables */
        .shell {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: var(--shell-size);
            height: var(--shell-size);
            border: 1px solid white;
            border-radius: 50%;
        }

        /* Defining the size variable for each shell */
        .shell-1 { --shell-size: 140px; }
        .shell-2 { --shell-size: 260px; }

        /* Electrons positioned via math and CSS variables */
        .electron {
            height: 15px;
            width: 15px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            
            /* Snap electron to center of its parent shell */
            top: 50%;
            left: 50%;
            margin-top: -7.5px;  /* Negative half of height */
            margin-left: -7.5px; /* Negative half of width */

            /* The math transformation formula */
            transform: rotate(var(--angle)) translate(var(--radius)) rotate(calc(-1 * var(--angle)));
        }
    </style>
</head>

<body>
    <div class="atom">
        <div class="nucleus">
            <div class="proton"></div>
        </div>

        <!-- Shell 1 (140px wide -> Radius is 70px from center) -->
        <div class="shell shell-1">
            <div class="electron" style="--angle: 0deg; --radius: 70px;"></div>
            <div class="electron" style="--angle: 180deg; --radius: 70px;"></div>
        </div>

        <!-- Shell 2 (260px wide -> Radius is 130px from center) -->
        <div class="shell shell-2">
            <div class="electron" style="--angle: 0deg; --radius: 130px;"></div>
            <div class="electron" style="--angle: 90deg; --radius: 130px;"></div>
            <div class="electron" style="--angle: 180deg; --radius: 130px;"></div>
            <div class="electron" style="--angle: 270deg; --radius: 130px;"></div>
        </div>
    </div>
</body>

</html>
